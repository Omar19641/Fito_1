function person(shirt,skin=0xf2c291,isGuard=false){const group=new THREE.Group(),clothes=mat(shirt),skinMat=mat(skin),pants=mat(isGuard?0x111827:0x263244),limbs=[];const torso=new THREE.Mesh(new THREE.CylinderGeometry(.22,.29,.68,10),clothes);torso.position.y=1.08;torso.castShadow=true;group.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.22,12,10),skinMat);head.position.y=1.62;head.castShadow=true;group.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.225,10,8,0,Math.PI*2,0,Math.PI*.52),mat(isGuard?0x111827:0x29211e));hair.position.y=1.68;group.add(hair);for(const s of [-1,1]){for(const cfg of [{x:s*.12,y:.78,r:.105,len:.48,m:pants,leg:true},{x:s*.36,y:1.32,r:.075,len:.48,m:clothes,leg:false}]){const pivot=new THREE.Group();pivot.position.set(cfg.x,cfg.y,0);const shaft=new THREE.Mesh(new THREE.CylinderGeometry(cfg.r*.82,cfg.r,cfg.len,8),cfg.m);shaft.position.y=-cfg.len/2;shaft.castShadow=true;pivot.add(shaft);group.add(pivot);limbs.push({pivot,phase:s*Math.PI*(cfg.leg?1:-1),leg:cfg.leg})}}if(isGuard){const badge=new THREE.Mesh(new THREE.BoxGeometry(.14,.12,.04),new THREE.MeshBasicMaterial({color:0xfbbf24}));badge.position.set(0,1.15,.27);group.add(badge)}return{group,limbs,walk:Math.random()*6,guard:isGuard,alert:0,cooldown:0}}

function buildWorld(){const m=maps[mapIndex];scene=new THREE.Scene();scene.background=new THREE.Color(m.bg);scene.fog=new THREE.FogExp2(m.bg,.012);scene.add(new THREE.HemisphereLight(0xc5efff,0x101827,1.45));const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(9,20,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(58,58),mat(m.floor,.9,.15));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const wall=mat(m.wall);addBox(56,4.2,.7,0,2,-28,wall);addBox(56,4.2,.7,0,2,28,wall);addBox(.7,4.2,56,-28,2,0,wall);addBox(.7,4.2,56,28,2,0,wall);for(const z of [-14,14]){addBox(17,3.8,.4,-19,1.9,z,wall);addBox(17,3.8,.4,19,1.9,z,wall)}const neon=new THREE.MeshBasicMaterial({color:m.glow});for(let x=-18;x<=18;x+=12){const line=new THREE.Mesh(new THREE.BoxGeometry(.07,.025,52),neon);line.position.set(x,.025,0);scene.add(line)}for(let i=0;i<8;i++){const x=-20+(i%4)*13,z=-19+Math.floor(i/4)*38;addBox(1.2,.9,1.2,x,.45,z,mat(i%2?0x334155:0x1e293b))}

function updateHud(){const w=tr();$('location').textContent=(lang==='ar'?'القطاع ١٣ // ':'SECTOR 13 // ')+w.names[mapIndex];$('stats').textContent=w.chips(found);$('inventory').textContent=w.key(hasKey);$('objectiveLabel').textContent=lang==='ar'?'المهمة':'OBJECTIVE';$('objective').textContent=w.objective[Math.min(phase,3)];$('help').textContent=lang==='ar'?'عصا الحركة • اسحب للنظر • ركض • تفاعل':'MOVE • DRAG LOOK • RUN • USE';$('useButton').textContent=w.use;$('sprintButton').textContent=w.run;$('lightButton').textContent=w.light;$('lookHint').textContent=w.look}

function showDialog(title,message,action,callback){$('dialogTitle').textContent=title;$('dialogText').textContent=message;$('dialogAction').textContent=action;$('dialogClose').textContent=tr().close;$('dialogAction').onclick=()=>{callback();$('dialog').style.display='none'};$('dialog').style.display='flex'}

function animatePerson(p,dt,speed){p.walk+=dt*(speed>.25?7+speed*1.3:0);for(const l of p.limbs)l.pivot.rotation.x=Math.sin(p.walk+l.phase)*(l.leg?.5:.23)*Math.min(1,speed/2);p.group.position.y=Math.abs(Math.sin(p.walk*2))*.025*Math.min(1,speed/2)}
function movePlayer(dt){const v=input(),run=keys.ShiftLeft||keys.ShiftRight||sprintTouch,speed=run?6.6:4.1,dx=(-Math.sin(camYaw)*v.y+Math.cos(camYaw)*v.x)*speed*dt,dz=(-Math.cos(camYaw)*v.y-Math.sin(camYaw)*v.x)*speed*dt,p=player.group.position,nx=clamp(p.x+dx,-26.3,26.3),nz=clamp(p.z+dz,-26.3,26.3);if(!blocked(nx,p.z))p.x=nx;if(!blocked(p.x,nz))p.z=nz;const moving=Math.hypot(v.x,v.y)>.05;if(moving)player.group.rotation.y=Math.atan2(dx,-dz);animatePerson(player,dt,moving?speed:0)}
function updateBots(dt){const p=player.group.position;bots.forEach((b,i)=>{const tx=p.x+Math.sin(camYaw)*2.5+Math.cos(camYaw)*(i?1.5:-1.5),tz=p.z-Math.cos(camYaw)*2.5+Math.sin(camYaw)*(i?1.5:-1.5),dx=tx-b.group.position.x,dz=tz-b.group.position.z,d=Math.hypot(dx,dz);if(d>1.3){const step=Math.min(d-1.1,3*dt);b.group.position.x+=dx/d*step;b.group.position.z+=dz/d*step;b.group.rotation.y=Math.atan2(dx,dz);animatePerson(b,dt,3)}else animatePerson(b,dt,0)})}
function updateGuards(dt){const p=player.group.position;guards.forEach(g=>{const dx=p.x-g.group.position.x,dz=p.z-g.group.position.z,d=Math.hypot(dx,dz);if(d<7.5){g.alert=Math.max(g.alert,3)}if(g.alert>0){g.alert-=dt;if(d>1.15){g.group.position.x+=dx/Math.max(d,.001)*2.6*dt;g.group.position.z+=dz/Math.max(d,.001)*2.6*dt;g.group.rotation.y=Math.atan2(dx,dz);animatePerson(g,dt,2.6)}else if(g.cooldown<=0){p.set(0,0,21);g.cooldown=4;g.alert=0;notify(tr().caught)}}else{const target=g.route[g.routeIndex],tx=target[0]-g.group.position.x,tz=target[1]-g.group.position.z,len=Math.hypot(tx,tz);if(len<.8)g.routeIndex=(g.routeIndex+1)%g.route.length;else{g.group.position.x+=tx/len*1.2*dt;g.group.position.z+=tz/len*1.2*dt;g.group.rotation.y=Math.atan2(tx,tz);animatePerson(g,dt,1.2)}}g.cooldown=Math.max(0,g.cooldown-dt)})}
function updateCamera(dt){const p=player.group.position,dist=8.1,height=3.0+camPitch*3.1,desired=new THREE.Vector3(p.x+Math.sin(camYaw)*dist,p.y+height,p.z+Math.cos(camYaw)*dist);camera.position.lerp(desired,1-Math.exp(-7*dt));camera.lookAt(p.x,p.y+1.05,p.z);flash.position.copy(camera.position);flash.target.position.set(p.x,1,p.z-4)}
function finish(win){if(finished)return;finished=true;started=false;$('mobile').style.display='none';const w=tr();showDialog(win?w.win:w.lose,win?w.winText:w.loseText,w.again,()=>location.reload());$('dialogClose').style.display='none'}
function update(dt,time){if(!renderer||!scene)return;if(started&&!finished){movePlayer(dt);updateBots(dt);updateGuards(dt);findNearby();chips.forEach(c=>{if(!c.found&&distance(player.group.position,c.mesh.position)<1.15){c.found=true;c.mesh.visible=false;found++;notify(found===5?tr().all:tr().found);updateHud()}});if(phase===3){escapeTimer-=dt;$('objective').textContent=`${tr().objective[3]} ${Math.ceil(escapeTimer)}s`;if(distance(player.group.position,world.exit.position)<2.2)finish(true);else if(escapeTimer<=0)finish(false)}}chips.forEach((c,i)=>{if(!c.found){c.mesh.rotation.y+=dt*1.4;c.mesh.position.y=1.2+Math.sin(time*2+i)*.12}});if(world){world.core.rotation.y+=dt;if(world.core.visible)world.core.position.y=1.5+Math.sin(time*2)*.12;if(world.exit.visible)world.exit.material.opacity=.55+.35*Math.sin(time*5)}if(player)updateCamera(dt);renderer.render(scene,camera)}
function startGame(){if(mode==='online'){alert(tr().onlineUnavailable);return}if(!window.THREE){alert('Three.js failed to load. Check your internet connection.');return}try{buildWorld()}catch(e){console.error(e);alert('Could not start the game: '+e.message);return}started=true;$('start').style.display='none';$('hud').style.display='flex';$('mobile').style.display='block';updateHud()}
$('startButton').onclick=startGame;$('dialogClose').onclick=()=>$('dialog').style.display='none';$('useButton').onclick=interact;$('lightButton').onclick=()=>{if(flash)flash.visible=!flash.visible};$('sprintButton').addEventListener('pointerdown',e=>{e.preventDefault();sprintTouch=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('sprintButton').addEventListener(ev,()=>sprintTouch=false));
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyE'||e.code==='Enter')interact();if(e.code==='KeyF'&&flash)flash.visible=!flash.visible});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{keys={};sprintTouch=false});
const stick=$('stick'),knob=$('stickKnob');function updateStick(e){const dx=e.clientX-joystick.cx,dy=e.clientY-joystick.cy,max=40,len=Math.hypot(dx,dy),scale=len>max?max/len:1;joystick.x=dx*scale/max;joystick.y=-dy*scale/max;knob.style.transform=`translate(${dx*scale}px,${dy*scale}px)`}stick.addEventListener('pointerdown',e=>{e.preventDefault();stick.setPointerCapture(e.pointerId);joystick.id=e.pointerId;const r=stick.getBoundingClientRect();joystick.cx=r.left+r.width/2;joystick.cy=r.top+r.height/2;updateStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===joystick.id)updateStick(e)});function endStick(e){if(e.pointerId!==joystick.id)return;joystick.id=null;joystick.x=joystick.y=0;knob.style.transform=''}stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
document.addEventListener('pointerdown',e=>{if(!started||e.pointerType!=='touch'||e.target.closest('button')||e.target.closest('#stick'))return;if(e.clientX>innerWidth*.4){lookId=e.pointerId;lastLook={x:e.clientX,y:e.clientY}}});document.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;camYaw-=(e.clientX-lastLook.x)*.008;camPitch=clamp(camPitch-(e.clientY-lastLook.y)*.004,-.05,.8);lastLook={x:e.clientX,y:e.clientY}});document.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});let mouse=false;document.addEventListener('mousedown',e=>{if(started&&!e.target.closest('button')){mouse=true;lastLook={x:e.clientX,y:e.clientY}}});document.addEventListener('mouseup',()=>mouse=false);document.addEventListener('mousemove',e=>{if(mouse&&started){camYaw-=(e.clientX-lastLook.x)*.004;camPitch=clamp(camPitch-(e.clientY-lastLook.y)*.002,-.05,.8);lastLook={x:e.clientX,y:e.clientY}}});
addEventListener('resize',()=>{if(!renderer||!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,innerWidth<700?1.25:1.6));renderer.shadowMap.enabled=innerWidth>700});
renderMenu();try{scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,100);renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.3));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;$('game').appendChild(renderer.domElement);clock=new THREE.Clock();(function loop(){requestAnimationFrame(loop);update(Math.min(clock.getDelta(),.05),clock.elapsedTime)})()}catch(e){console.error(e);$('startNote').textContent='WebGL initialization failed. Try another browser.'}
})();
</script>
